# Shared configuration for all profiles. Secrets are NEVER given defaults here.
# Profiles: dev (local), test (automated tests), prod (deployment), demo (adds seed data).
spring:
  application:
    name: examforge
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    time-zone: UTC

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ExamForge
    version: '@project.version@'

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [%X{requestId:-}] [%X{userId:-}]"

# ---------------------------------------------------------------------------
# ExamForge settings. Each module binds its own @ConfigurationProperties record.
# Keys for later modules are added in S02 (contract freeze) — do not add ad hoc.
# ---------------------------------------------------------------------------
examforge:
  scheduling:
    enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
