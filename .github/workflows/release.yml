# ExamForge — Release & Deploy
# Trigger: pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) on main, created by the release manager.
# 1) builds & pushes images to GHCR, 2) creates a GitHub Release, 3) deploys over SSH
#    (only when repository variable DEPLOY_ENABLED == 'true', from Day 11).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)deploy, e.g. v0.9.0-rc.1
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  images:
    name: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create GitHub Release
      packages: write     # push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Compute image names (GHCR requires lowercase)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/examforge-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/examforge-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" --generate-notes --verify-tag $PRERELEASE

  deploy:
    name: deploy-production
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_BASE_URL }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ env.TAG }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TAG
          script: |
            set -euo pipefail
            cd /opt/examforge
            sed -i "s/^APP_TAG=.*/APP_TAG=${TAG}/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_BASE_URL }}/api/actuator/health" | grep -q '"UP"'; then
              echo "Healthy"; exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
