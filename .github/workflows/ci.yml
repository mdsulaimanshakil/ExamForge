# ExamForge — Continuous Integration
# Required status checks (configure in rulesets after the first run):
#   pr-title, backend, frontend, docker-build        (+ e2e on main from Day 12)
# Every required job ALWAYS runs and reports a status. Steps are guarded with
# hashFiles(...) so the pipeline is green before backend/ or frontend/ exist (Day 1).
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. PR title must be a Conventional Commit (it becomes the squash commit)
  # ---------------------------------------------------------------------------
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            perf
            docs
            style
            build
            ci
            chore
            revert
            release
          scopes: |
            auth
            security
            user
            profile
            subject
            question
            import
            exam
            attempt
            grading
            result
            analytics
            notification
            audit
            dashboard
            ui
            shell
            db
            api
            ci
            docker
            deploy
            deps
            docs
            release
            e2e
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The subject must start with a lowercase letter."
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Push event — title check not applicable."

  # ---------------------------------------------------------------------------
  # 2. Backend: format check → compile → unit tests (Surefire) →
  #    integration tests with Testcontainers PostgreSQL (Failsafe) → JaCoCo
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check formatting (Spotless)
        if: hashFiles('backend/pom.xml') != ''
        run: ./mvnw -B -ntp spotless:check

      - name: Build, test (unit + integration), coverage
        if: hashFiles('backend/pom.xml') != ''
        run: ./mvnw -B -ntp verify

      - name: Upload test & coverage reports
        if: always() && hashFiles('backend/pom.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload application JAR
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7
          if-no-files-found: ignore

      - name: Backend not present yet
        if: hashFiles('backend/pom.xml') == ''
        run: echo "backend/pom.xml not found — skipping (expected only before S01 is merged)."
        working-directory: .

  # ---------------------------------------------------------------------------
  # 3. Frontend: install → lint → format check → typecheck → tests → build
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint

      - name: Format check
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run format:check

      - name: Type check
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run typecheck

      - name: Unit & component tests (with coverage)
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run test:ci

      - name: Production build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build

      - name: Upload build artifact
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      - name: Frontend not present yet
        if: hashFiles('frontend/package-lock.json') == ''
        run: echo "frontend/package-lock.json not found — skipping (expected only before M01 is merged)."
        working-directory: .

  # ---------------------------------------------------------------------------
  # 4. Docker build verification (no push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: examforge-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: examforge-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # 5. End-to-end tests — only on release PRs into main (from Day 12)
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Generate throwaway secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=E2e-$(openssl rand -hex 8)" >> "$GITHUB_ENV"

      - name: Start full stack (demo profile with seed data)
        if: hashFiles('deploy/docker-compose.e2e.yml') != ''
        run: docker compose -f deploy/docker-compose.e2e.yml up -d --build --wait --wait-timeout 240

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/playwright.config.ts') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Playwright
        if: hashFiles('frontend/playwright.config.ts') != '' && hashFiles('deploy/docker-compose.e2e.yml') != ''
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report
        if: always() && hashFiles('frontend/playwright.config.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure() && hashFiles('deploy/docker-compose.e2e.yml') != ''
        run: docker compose -f deploy/docker-compose.e2e.yml logs --no-color --tail=300
